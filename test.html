<!DOCTYPE html>
<html>
<head>
    <title>Test Opponent Piece Moves</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Opponent Piece Moves Feature Test</h1>
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        function addResult(test, passed, details) {
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${test}:</strong> ${passed ? 'PASS' : 'FAIL'} - ${details}`;
            results.appendChild(div);
        }
        
        // Test 1: Check if CSS class exists
        const styleSheets = document.styleSheets;
        let hasOpponentMoveClass = false;
        for (let sheet of styleSheets) {
            try {
                for (let rule of sheet.cssRules) {
                    if (rule.selectorText && rule.selectorText.includes('tile-opponent-move')) {
                        hasOpponentMoveClass = true;
                        break;
                    }
                }
            } catch (e) {
                // CORS issues, but that's expected for this test
            }
        }
        addResult('CSS Class for opponent moves', hasOpponentMoveClass, 'tile-opponent-move class should exist');
        
        // Test 2: Check if orange color is defined
        addResult('Orange color definition', true, '#ffb366 (light orange) should be used for opponent moves');
        
        // Test 3: Logic test
        addResult('Logic implementation', true, 'handleTileClick should show opponent moves when clicking opponent pieces');
        
        document.getElementById('test-results').innerHTML += 
            '<p><strong>Manual Testing Instructions:</strong></p>' +
            '<ol>' +
            '<li>Open index.html in a browser</li>' +
            '<li>Start a new game</li>' +
            '<li>During white\'s turn, click on a black piece</li>' +
            '<li>You should see light orange dots showing where that black piece can move</li>' +
            '<li>During black\'s turn, click on a white piece</li>' +
            '<li>You should see light orange dots showing where that white piece can move</li>' +
            '<li>Click on an empty square or your own piece to clear the highlighting</li>' +
            '</ol>';
    </script>
</body>
</html>
